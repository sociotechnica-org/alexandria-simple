<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sorare — the dynamic system model</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --ink: #0b1016; --ink-2: #111a22; --ink-3: #18242f; --line: #233340; --ghost: #34485a;
    --text: #dbe7ef; --muted: #7d8fa0; --teal: #4fd1c5; --amber: #f0b45a; --violet: #c4a1ff;
    --green: #7ee081; --pink: #ff8fb1; --blue: #6ea8ff; --hot: #ff6a3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text);
    font: 14px/1.45 ui-sans-serif, -apple-system, "Inter", "Segoe UI", system-ui, sans-serif; }
  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header { display: flex; align-items: center; gap: 18px; padding: 14px 22px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #0f171f, var(--ink)); }
  header h1 { margin: 0; font: 600 17px/1.2 "Iowan Old Style", Georgia, serif; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  header .goal { margin-left: auto; padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(240,180,90,.5);
    color: var(--amber); font-size: 13px; background: rgba(240,180,90,.06); }
  main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  .stage { position: relative; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
    background: radial-gradient(1400px 900px at 50% 50%, #0f1d25 0%, var(--ink) 75%); }
  svg#map { width: 100%; flex: 1; min-height: 0; display: block; }
  .time { padding: 10px 18px 6px; border-bottom: 1px solid var(--line); background: rgba(11,16,22,.6); }
  .time .row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .time .lbl { width: 64px; flex: none; font-size: 10.5px; font-weight: 800; letter-spacing: 1.8px; color: var(--muted); }
  .ph { position: relative; flex: 1; cursor: pointer; border: 1px solid var(--line); background: var(--ink-2); border-radius: 8px; padding: 5px 10px; font-size: 12px; }
  .ph b { font-size: 12.5px; } .ph span { color: var(--muted); margin-left: 6px; font-size: 11.5px; }
  .ph:hover { border-color: var(--ghost); }
  .ph.sel { border-color: var(--amber); background: #2a1e0c; } .ph.sel b { color: var(--amber); }
  .ph.ev { flex: none; border-style: dashed; }
  .ph .now { position: absolute; top: -7px; right: 8px; font-size: 9.5px; font-weight: 800; color: #0b1016; background: var(--amber); border-radius: 999px; padding: 0 6px; }
  .time .note { min-height: 20px; font-size: 12.5px; color: var(--muted); padding: 2px 0 2px 70px; }
  .time .note b { color: var(--amber); }
  svg.phased .node:not(.ph-on) { opacity: .22; }
  svg.phased .edge:not(.ph-on) { opacity: .1; }
  aside { border-left: 1px solid var(--line); background: var(--ink-2); overflow-y: auto; padding: 20px 22px 40px; }

  /* regions */
  .region rect { stroke-width: 1.2; }
  .region .rl { font-size: 13px; font-weight: 800; letter-spacing: 3px; }
  .region .rs { font-size: 12px; fill: var(--muted); }

  /* edges */
  .edge path { fill: none; stroke-width: 2.4; transition: opacity .2s; }
  .edge.dashed path { stroke-dasharray: 6 6; }
  .edge .pill rect { fill: #0d151c; stroke-width: 1.1; }
  .edge .pill text { font-size: 11.5px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
  .toll rect { fill: #2a1210; stroke: var(--hot); stroke-width: 1; }
  .toll text { fill: #ffb199; font-size: 10.5px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .edge, .node { transition: opacity .2s; }
  svg.focus .edge:not(.hi) { opacity: .07; }
  svg.focus .node:not(.hi) { opacity: .28; }
  svg.res .edge:not(.on) { opacity: .07; }

  /* nodes */
  .node { cursor: pointer; }
  .node.stock { cursor: default; }
  .node text { pointer-events: none; }
  .node .name { fill: var(--text); font-size: 13.5px; font-weight: 700; text-anchor: middle; }
  .node .subt { fill: var(--muted); font-size: 11.5px; text-anchor: middle; }
  .node:not(.stock):hover .body { stroke-width: 3.2; filter: brightness(1.3); }
  .heart .body { filter: drop-shadow(0 0 14px rgba(240,180,90,.55)); }
  .heart-ring { fill: none; stroke: var(--amber); stroke-width: 2; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { stroke-opacity: .15; } 50% { stroke-opacity: .75; } }
  .served-ring { fill: none; stroke-width: 4; }
  .served-tag rect { stroke-width: 1; }
  .served-tag text { font-size: 10.5px; font-weight: 800; letter-spacing: 1px; text-anchor: middle; dominant-baseline: central; }
  .offered .body { stroke-dasharray: 4 5; }

  /* panel */
  .kicker { color: var(--amber); font-size: 11.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
  aside h2 { font: 600 21px/1.25 "Iowan Old Style", Georgia, serif; margin: 8px 0 8px; }
  aside h3 { font-size: 11.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
  .why { color: var(--muted); margin: 0 0 6px; }
  .legend { display: grid; grid-template-columns: 34px 1fr; gap: 8px 10px; align-items: center; font-size: 12.5px; }
  .legend svg { width: 34px; height: 26px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { border: 1px solid var(--line); background: var(--ink); color: var(--text); border-radius: 999px;
    padding: 5px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .chip .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .chip.on { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
  .toggle { display: flex; gap: 10px; align-items: center; margin-top: 4px; font-size: 13px; cursor: pointer; }
  .toggle input { accent-color: var(--amber); }
  .callout { padding: 11px 13px; border-radius: 10px; background: rgba(255,106,61,.08); border: 1px solid rgba(255,106,61,.35);
    margin-top: 12px; font-size: 12.5px; }
  .jobs .grp { color: var(--muted); font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; margin: 12px 0 4px; }
  .jobs .row { display: flex; align-items: center; gap: 9px; padding: 6px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .jobs .row svg { width: 22px; height: 18px; flex: none; }
  .jobs .row:hover { background: var(--ink-3); }
  .jobs .row .s { margin-left: auto; font-size: 10.5px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; }
  .foot { color: var(--muted); font-size: 11.5px; margin-top: 22px; border-top: 1px solid var(--line); padding-top: 12px; }

  /* rooms */
  .room-scrim { position: absolute; inset: 0; background: rgba(5,8,11,.55); }
  .room { position: absolute; inset: 22px; border-radius: 16px; background: rgba(9,14,19,.97);
    border: 1px solid rgba(79,209,197,.35); box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 60px rgba(79,209,197,.05);
    padding: 26px 30px 34px; overflow-y: auto; animation: grow .42s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform: scale(.05); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .room .close { position: absolute; top: 16px; right: 18px; border: 1px solid var(--line); background: var(--ink-3);
    color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit; }
  .room .kind { font-size: 11.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
  .room h2 { font: 600 28px/1.2 "Iowan Old Style", Georgia, serif; margin: 6px 0 16px; }
  .room h4 { font-size: 11.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
  .stmt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .box { background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .box small { display: block; color: var(--muted); font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 4px; }
  .scale { display: grid; grid-template-columns: 1fr 60px 1fr; gap: 0; align-items: stretch; }
  .pan { border-radius: 12px; padding: 14px 16px; }
  .pan.play { background: rgba(79,209,197,.07); border: 1px solid rgba(79,209,197,.35); }
  .pan.sell { background: rgba(240,180,90,.07); border: 1px solid rgba(240,180,90,.35); }
  .pan b { display: block; font-size: 15px; margin-bottom: 8px; }
  .pan ul { margin: 0; padding-left: 18px; } .pan li { margin-bottom: 6px; }
  .fulcrum { display: grid; place-items: center; color: var(--muted); font: 600 22px Georgia, serif; }
  table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.t th { text-align: left; color: var(--muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600;
    padding: 6px 10px; border-bottom: 1px solid var(--line); }
  table.t td { padding: 8px 10px; border-bottom: 1px solid #1a2631; }
  .yes { color: var(--teal); } .no { color: #ff9b7a; } .unk { color: var(--muted); }
  .tree { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tree .fmt { background: var(--ink-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tree .fmt b { font-size: 15px; } .tree .fmt .m { color: var(--muted); font-size: 12px; }
  .tracks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .track { border-radius: 8px; padding: 9px 11px; font-size: 12.5px; border: 1px solid var(--line); background: var(--ink); }
  .track b { display: block; font-size: 13px; margin-bottom: 2px; }
  .ladder { display: flex; align-items: flex-end; gap: 10px; height: 170px; margin-top: 6px; }
  .rung { flex: 1; border-radius: 8px 8px 0 0; background: linear-gradient(180deg, rgba(240,180,90,.35), rgba(240,180,90,.08));
    border: 1px solid rgba(240,180,90,.4); border-bottom: 0; position: relative; display: flex; flex-direction: column;
    justify-content: flex-start; align-items: center; padding-top: 8px; font-size: 12.5px; }
  .rung b { font-size: 15px; color: var(--amber); }
  .rung.here { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(79,209,197,.5); }
  .rung .you { position: absolute; top: -26px; font-size: 11px; color: var(--teal); font-weight: 700; white-space: nowrap; }
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .slot { border-radius: 10px; padding: 11px 12px; border: 1px solid var(--line); background: var(--ink-2); font-size: 12.5px; min-height: 92px; }
  .slot b { display: block; font-size: 13px; margin-bottom: 4px; }
  .slot.open { border-style: dashed; color: var(--muted); }
  .backbone { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 14px; }
  .step .num { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--teal); color: var(--teal); display: grid;
    place-items: center; font-weight: 700; font-size: 12.5px; margin-bottom: 8px; }
  .step.gap .num { border-color: var(--hot); color: var(--hot); }
  .step .t { font-weight: 600; margin-bottom: 8px; min-height: 40px; }
  .code { display: block; font: 12px ui-monospace, Menlo, monospace; padding: 4px 8px; border-radius: 6px; margin-bottom: 6px;
    background: rgba(79,209,197,.1); border: 1px solid rgba(79,209,197,.3); color: #9fe7df; }
  .code.gap { background: transparent; border: 1px dashed rgba(255,106,61,.6); color: #ff9b7a; font-family: inherit; }
  .rp { display: inline-block; padding: 3px 10px; border-radius: 999px; border: 1px solid; font-size: 12.5px; font-weight: 600; margin: 0 6px 6px 0; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Sorare — the dynamic system model</h1>
      <div class="sub">The dynamic system model · stocks, jobs, decisions and time · in-season Limited · <a href="roadmap.html" style="color:#4fd1c5">the simple jobs map →</a></div>
    </div>
    <div class="goal">Goal: leave the season with at least the bankroll I brought</div>
  </header>
  <main>
    <div class="stage" id="stage"><div class="time" id="time"></div><svg id="map" viewBox="0 0 1500 920" preserveAspectRatio="xMidYMid meet"><defs id="defs"></defs>
      <g id="layer-regions"></g><g id="layer-edges"></g><g id="layer-nodes"></g></svg></div>
    <aside id="panel"></aside>
  </main>
</div>
<script>
// ---------------------------------------------------------------------------
// Grammar: STOCKS are what you hold. JOBS turn one stock into another.
// A DECISION is a valve where a stock can go two ways. TOLLS sit on crossings.
// ---------------------------------------------------------------------------
const RES = {
  cash: { label: "Cash", hex: "#f0b45a" },
  eth: { label: "ETH", hex: "#c9d3dd" },
  cards: { label: "Cards", hex: "#4fd1c5" },
  essence: { label: "Essence", hex: "#c4a1ff" },
  xp: { label: "XP", hex: "#7ee081" },
  perks: { label: "Clues · credits · tickets", hex: "#ff8fb1" },
  bonus: { label: "Team bonus", hex: "#6ea8ff" },
  vault: { label: "Vault bonus", hex: "#ffd479" },
};

const REGIONS = [
  { id: "economy", x: 20, w: 618, label: "ECONOMY", sub: "money and in-game currency", stroke: "rgba(240,180,90,.28)", fill: "rgba(240,180,90,.035)", col: "#f0b45a" },
  { id: "pieces", x: 662, w: 300, label: "GAME PIECES", sub: "your collection", stroke: "rgba(79,209,197,.3)", fill: "rgba(79,209,197,.04)", col: "#4fd1c5" },
  { id: "game", x: 986, w: 494, label: "GAME", sub: "where pieces earn", stroke: "rgba(110,168,255,.3)", fill: "rgba(110,168,255,.035)", col: "#6ea8ff" },
];

// kind: stock | group | job | sub | decision | offered
// Stocks in the wallet belong to a group; an arrow can land on the group as a whole.
const N = {
  bank:     { kind: "stock", region: "economy", x: 118, y: 120, w: 150, h: 50, res: "cash", name: "Your money", sub: "outside Sorare", outside: true },
  cash:     { kind: "stock", group: "money", x: 118, y: 270, w: 150, h: 50, res: "cash", name: "Cash", sub: "earns no interest" },
  eth:      { kind: "stock", group: "money", x: 118, y: 330, w: 150, h: 50, res: "eth", name: "ETH", sub: "exit: buy cards, sell for $", exposure: true },
  credits:  { kind: "stock", group: "noncash", x: 118, y: 410, w: 150, h: 50, res: "perks", name: "Credits", sub: "money off a buy" },
  clues:    { kind: "stock", group: "noncash", x: 118, y: 468, w: 150, h: 50, res: "perks", name: "Clues", sub: "craft only" },
  essence:  { kind: "stock", group: "noncash", x: 118, y: 584, w: 150, h: 50, res: "essence", name: "Essence", sub: "no cash value" },
  axp:      { kind: "stock", group: "noncash", x: 118, y: 526, w: 150, h: 50, res: "xp", name: "Assignable XP", sub: "feed it to any card" },
  money:    { kind: "group", x: 210, y1: 245, y2: 355, name: "Money" },
  noncash:  { kind: "group", x: 210, y1: 385, y2: 609, name: "Non-cash rewards" },
  cards:    { kind: "stock", region: "pieces", x: 812, y: 440, w: 206, h: 104, res: "cards", name: "Your cards", sub: "on-card XP travels with each card" },

  bankroll: { kind: "job", region: "economy", x: 340, y: 150, r: 46, name: "Manage the bankroll", sub: "" },
  sorare:   { kind: "job", region: "economy", x: 478, y: 285, r: 50, name: "Sorare marketplace", sub: "auctions · buy it now" },
  manager:  { kind: "job", region: "economy", x: 478, y: 455, r: 50, name: "Manager marketplace", sub: "" },
  wheel:    { kind: "sub", region: "economy", x: 350, y: 520, r: 34, name: "Spin the wheel", sub: "sub-game · seasonal" },
  craft:    { kind: "job", region: "economy", x: 575, y: 720, r: 48, name: "Craft", sub: "Essence → cards" },
  playsell: { kind: "decision", region: "pieces", x: 812, y: 215, h: 66, name: "Play, sell or seal?", sub: "the heart of the map" },
  vault:    { kind: "stock", region: "pieces", x: 905, y: 104, w: 112, h: 50, res: "vault", name: "The vault", sub: "13% bonus today" },
  collect:  { kind: "job", region: "pieces", x: 812, y: 690, r: 54, name: "Build the collection", sub: "team bonus · missions" },
  lineups:  { kind: "job", region: "game", x: 1110, y: 235, r: 58, name: "Build winning lineups", sub: "configure · XP · bonus" },
  tourney:  { kind: "job", region: "game", x: 1335, y: 445, r: 68, name: "Succeed at tournaments", sub: "leaderboards · streaks" },
  daily:    { kind: "sub", region: "game", x: 1110, y: 650, r: 40, name: "Daily missions", sub: "sub-game · nightly" },
  rare:     { kind: "offered", region: "game", x: 1380, y: 790, r: 32, name: "Rare and up", sub: "offered · not played" },
};
for (const g of ["money", "noncash"]) N[g].y = (N[g].y1 + N[g].y2) / 2;

// bend: perpendicular offset of the curve's control point; ctrl: absolute control point.
// res may be a list when one arrow carries several resources.
const E = [
  { from: "bank", to: "bankroll", res: ["cash", "eth"], label: "in · out", both: true, toll: "≈1% in · fee out", bend: -22 },
  { from: "bankroll", to: "money", res: ["cash", "eth"], label: "reinvest", both: true, bend: -14 },
  { from: "money", to: "sorare", res: ["cash", "eth"], label: "buy", bend: 16 },
  { from: "credits", to: "sorare", res: "perks", label: "money off", bend: -12 },
  { from: "sorare", to: "cards", res: "cards", label: "first-owner cards", bend: -18 },
  { from: "sorare", to: "collect", res: "cards", label: "missions", ctrl: [680, 640], dashed: true },
  { from: "money", to: "manager", res: ["cash", "eth"], label: "buy", bend: 22 },
  { from: "manager", to: "money", res: ["cash", "eth"], label: "sale: $ or ETH", bend: 22 },
  { from: "manager", to: "cards", res: "cards", label: "secondhand · trades", bend: 14 },
  { from: "playsell", to: "manager", res: "cards", label: "sell · trade", bend: 30, toll: "5% fee · ½ XP · team points" },
  { from: "playsell", to: "vault", res: "vault", label: "seal · unseal", both: true, bend: -46 },
  { from: "vault", to: "tourney", res: "vault", label: "vault bonus on $ · Essence prizes", ctrl: [1330, 110], dashed: true },
  { from: "cards", to: "playsell", res: "cards", label: "" },
  { from: "playsell", to: "lineups", res: "cards", label: "play", bend: -18 },
  { from: "sorare", to: "wheel", res: "perks", label: "tickets", ctrl: [360, 400] },
  { from: "wheel", to: "noncash", res: ["perks", "essence", "xp"], label: "random reward", bend: -10 },
  { from: "essence", to: "craft", res: "essence", label: "required", bend: 10 },
  { from: "clues", to: "craft", res: "perks", label: "optional", bend: -14, dashed: true },
  { from: "craft", to: "cards", res: "cards", label: "crafted", bend: 22 },
  { from: "axp", to: "cards", res: "xp", label: "feed XP", ctrl: [480, 650] },
  { from: "cards", to: "collect", res: "cards", label: "hold" },
  { from: "craft", to: "collect", res: "cards", label: "counts", bend: 18, dashed: true },
  { from: "collect", to: "essence", res: "essence", label: "mission Essence", ctrl: [520, 920] },
  { from: "collect", to: "lineups", res: "bonus", label: "team bonus", bend: 50, dashed: true },
  { from: "lineups", to: "tourney", res: "cards", label: "lineups", bend: -20 },
  { from: "tourney", to: "money", res: ["cash", "eth"], label: "prizes: $ or ETH, your pick", c1: [1250, -250], c2: [560, 120] },
  { from: "tourney", to: "cards", res: ["xp", "cards"], label: "on-card XP · prize cards", bend: -16 },
  { from: "tourney", to: "noncash", res: ["essence", "perks", "xp"], label: "Essence · credits · XP prizes", ctrl: [900, 1160] },
  { from: "cards", to: "daily", res: "cards", label: "any-season cards", bend: 24 },
  { from: "daily", to: "noncash", res: ["xp", "essence", "perks"], label: "nightly: XP + one random reward", ctrl: [760, 960] },
  { from: "essence", to: "tourney", res: "essence", label: "Arena entry", ctrl: [1040, 1010], dashed: true },
];

// "served" — a quick read of the sorare repo (README, plans/JOBS.md, file names). Not an audit.
const SERVED = {
  sorare: "heavy", manager: "some", wheel: "heavy", craft: "some", collect: "some",
  lineups: "trace", tourney: "none", playsell: "none", daily: "none", bankroll: "none",
};
const SERVED_STYLE = { heavy: ["#4fd1c5", "WELL SERVED"], some: ["#8fd18a", "SOME"], trace: ["#ff9b7a", "BARELY"], none: ["#ff6a3d", "NOTHING YET"] };

const state = { focus: null, res: null, served: false };

// ---------------------------------------------------------------------------
// Geometry
// ---------------------------------------------------------------------------
function cubic(e) {
  const c1 = { x: e.c1[0], y: e.c1[1] }, c2 = { x: e.c2[0], y: e.c2[1] };
  const p1 = rim(N[e.from], c1, 4), p2 = rim(N[e.to], c2, 9);
  const mid = { x: (p1.x + 3 * c1.x + 3 * c2.x + p2.x) / 8, y: (p1.y + 3 * c1.y + 3 * c2.y + p2.y) / 8 };
  return { d: `M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`, mid };
}
function ctrlOf(e) {
  const a = N[e.from], b = N[e.to];
  if (e.ctrl) return { x: e.ctrl[0], y: e.ctrl[1] };
  const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
  const nx = -dy / L, ny = dx / L, k = e.bend || 0;
  return { x: (a.x + b.x) / 2 + nx * k, y: (a.y + b.y) / 2 + ny * k };
}
function rim(n, toward, pad = 6) {
  if (n.kind === "group") return { x: n.x + pad, y: Math.max(n.y1 + 8, Math.min(n.y2 - 8, toward.y)) };
  const dx = toward.x - n.x, dy = toward.y - n.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  let d;
  if (n.kind === "stock") d = Math.min(n.w / 2 / Math.abs(ux || 1e-6), n.h / 2 / Math.abs(uy || 1e-6));
  else if (n.kind === "decision") d = n.h / (Math.abs(ux) + Math.abs(uy));
  else d = n.r;
  return { x: n.x + ux * (d + pad), y: n.y + uy * (d + pad) };
}
function geom(e) {
  if (e.c1) return cubic(e);
  const c = ctrlOf(e), p1 = rim(N[e.from], c, e.both ? 9 : 4), p2 = rim(N[e.to], c, 9);
  const mid = { x: (p1.x + 2 * c.x + p2.x) / 4, y: (p1.y + 2 * c.y + p2.y) / 4 };
  return { d: `M${p1.x},${p1.y} Q${c.x},${c.y} ${p2.x},${p2.y}`, mid };
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function wrap(text, max) {
  const out = []; let cur = "";
  for (const w of String(text).split(/\s+/)) {
    if ((cur + " " + w).trim().length > max && cur) { out.push(cur); cur = w; } else cur = (cur + " " + w).trim();
  }
  if (cur) out.push(cur);
  return out;
}
function textBlock(lines, x, y, cls, lh = 16) {
  const y0 = y - ((lines.length - 1) * lh) / 2;
  return `<text class="${cls}">${lines.map((l, i) => `<tspan x="${x}" y="${y0 + i * lh}">${esc(l)}</tspan>`).join("")}</text>`;
}
function pill(x, y, label, hexes) {
  const dots = hexes.length > 1 ? hexes : [];
  const pad = dots.length * 9, w = label.length * 6.9 + 20 + pad;
  return `<g class="pill" transform="translate(${x},${y})"><rect x="${-w / 2}" y="-11" width="${w}" height="22" rx="11" stroke="${hexes[0]}"/>
    ${dots.map((h, i) => `<circle cx="${-w / 2 + 12 + i * 9}" cy="0" r="3.4" fill="${h}"/>`).join("")}
    <text x="${pad / 2}" fill="${dots.length ? "#dbe7ef" : hexes[0]}">${esc(label)}</text></g>`;
}
function toll(x, y, label) {
  const w = label.length * 6.1 + 26;
  return `<g class="toll" transform="translate(${x},${y})"><rect x="${-w / 2}" y="-10" width="${w}" height="20" rx="4"/>
    <text>⛔ ${esc(label)}</text></g>`;
}

function renderNodes() {

function openRoom(id) {
  closeRoom();
  const n = N[id], room = ROOMS[id], stage = document.getElementById("stage"), svg = document.getElementById("map");
  const pt = svg.createSVGPoint(); pt.x = n.x; pt.y = n.y;
  const sp = pt.matrixTransform(svg.getScreenCTM()), sr = stage.getBoundingClientRect();
  const w = document.createElement("div");
  w.id = "room-wrap";
  w.innerHTML = `<div class="room-scrim"></div><div class="room" style="transform-origin:${sp.x - sr.left - 22}px ${sp.y - sr.top - 22}px">
    <button class="close">Close ✕</button><div class="kind" style="color:${room.color}">${room.kind}</div>
    <h2>${esc(n.name)}</h2>${room.html()}</div>`;
  stage.appendChild(w);
  w.querySelector(".close").onclick = closeRoom;
  w.querySelector(".room-scrim").onclick = closeRoom;
}
function closeRoom() { document.getElementById("room-wrap")?.remove(); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeRoom(); });

// ---------------------------------------------------------------------------
// Time. Priority isn't fixed: each phase and event lights up the part of the
// system that matters while it runs.
// ---------------------------------------------------------------------------
const PHASES = [
  { id: "p1", name: "Wheel and tickets", when: "Oct 6 – 24", what: "Nothing matters more than optimizing the wheel and tickets.", nodes: ["sorare", "wheel", "credits", "clues", "craft", "collect", "noncash"] },
  { id: "p2", name: "The post-wheel dip", when: "late Oct", now: true, what: "The market crashes to a local low. Get good at buying the dip.", nodes: ["sorare", "manager", "money", "bankroll", "cash", "eth"] },
  { id: "p3", name: "Bonus-cash inflation", when: "from Oct 30", what: "People overpay for cards. Know when to play, sell or seal. Team bonuses matter most now.", nodes: ["playsell", "manager", "vault", "tourney", "lineups", "collect", "cards"] },
  { id: "p4", name: "The real crash", when: "when bonus cash ends", what: "By now you need to have won cash, or divested enough to catch the bounce.", nodes: ["manager", "bankroll", "money", "cash", "eth", "sorare"] },
  { id: "p5", name: "The flatline", when: "rest of the season", what: "Prices drift down while key cards spike. Can you win more than you'd sell for?", nodes: ["playsell", "tourney", "lineups", "manager", "daily", "cards"] },
];
const EVENTS = [
  { id: "e1", name: "Launch boost", when: "GW 1–8 from Oct 20", what: "Champion hot streak prizes are doubled and the first two targets lowered.", nodes: ["tourney", "lineups"] },
  { id: "e2", name: "Emirates NBA Cup board", when: "Oct 30 – Nov 17", what: "A new game: five steps, 4 lives each. 200 / 400 / 1,000 Essence, then 50 credits, then a share of $10K. Classic cards carry the first steps.", nodes: ["tourney", "lineups", "cards", "noncash", "money", "essence", "credits"] },
  { id: "e3", name: "The wheel returns", when: "Black Friday → Christmas", what: "The wheel usually comes back, and tickets matter again.", nodes: ["wheel", "sorare", "craft", "clues", "credits"] },
];
const tstate = { id: null };
function renderTime() {
  const ph = (p, ev) => `<div class="ph ${ev ? "ev" : ""} ${tstate.id === p.id ? "sel" : ""}" data-ph="${p.id}">${p.now ? '<span class="now">NOW</span>' : ""}<b>${p.name}</b><span>${p.when}</span></div>`;
  const cur = [...PHASES, ...EVENTS].find((p) => p.id === tstate.id);
  document.getElementById("time").innerHTML = `<div class="row"><span class="lbl">SEASON</span>${PHASES.map((p) => ph(p)).join("")}</div>
    <div class="row"><span class="lbl">EVENTS</span>${EVENTS.map((p) => ph(p, true)).join("")}</div>
    <div class="note">${cur ? `<b>${cur.name}</b> (${cur.when}): ${cur.what}` : "Pick a phase or an event to light up the part of the system it puts in play."}</div>`;
  document.querySelectorAll("[data-ph]").forEach((el) => el.onclick = () => { tstate.id = tstate.id === el.dataset.ph ? null : el.dataset.ph; applyTime(); });
}
function applyTime() {
  const cur = [...PHASES, ...EVENTS].find((p) => p.id === tstate.id), on = new Set(cur ? cur.nodes : []);
  document.getElementById("map").classList.toggle("phased", !!cur);
  document.querySelectorAll(".node").forEach((n) => n.classList.toggle("ph-on", on.has(n.dataset.id)));
  document.querySelectorAll(".edge").forEach((e) => e.classList.toggle("ph-on", on.has(e.dataset.from) && on.has(e.dataset.to)));
  renderTime();
}
renderDefs(); renderRegions(); renderEdges(); renderNodes(); renderPanel(); applyTime();
const hash = location.hash.slice(1);
if (hash.startsWith("time-")) { tstate.id = hash.slice(5); applyTime(); }
if (hash === "served") { state.served = true; renderNodes(); renderPanel(); }
if (hash.startsWith("res-")) { state.res = hash.slice(4); document.getElementById("map").classList.add("res"); renderEdges(); renderPanel(); }
if (hash.startsWith("focus-")) setFocus(hash.slice(6));
if (hash.startsWith("room-")) openRoom(hash.slice(5));
